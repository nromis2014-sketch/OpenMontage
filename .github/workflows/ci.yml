name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Weekly run catches upstream font revisions between pull requests.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: make install-dev

      - name: Run lint smoke checks
        run: make lint

      - name: Run test suite
        run: make test

  font-data:
    name: Check embedded font data
    runs-on: ubuntu-latest
    # Gates merges, and also runs weekly to catch upstream drift between PRs.
    #
    # Note this can fail for a reason the PR did not cause: the check
    # re-downloads the faces from the Google Fonts API, so a new upstream font
    # revision turns it red everywhere until someone runs
    # `python scripts/generate_font_data.py` and commits the result. That is
    # the fix — regenerate, don't hand-edit fontData.ts.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No dependencies: the script is stdlib-only.
      - name: Check fontData.ts matches upstream
        run: python scripts/generate_font_data.py --check
